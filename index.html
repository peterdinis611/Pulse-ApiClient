<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse API Client</title>
    <script>
      (function () {
        try {
          var theme =
            localStorage.getItem("pulse-api-client/theme") ||
            localStorage.getItem("relay-api-client/theme") ||
            "system";
          var darkThemes = ["dark", "midnight", "graphite", "amethyst", "obsidian"];
          var resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme;
          var dark = darkThemes.indexOf(resolved) >= 0;
          document.documentElement.setAttribute("data-theme", resolved);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div
        style="
          display: flex;
          min-height: 100vh;
          align-items: center;
          justify-content: center;
          font-family: system-ui, sans-serif;
          color: #64748b;
        "
      >
        Loading Pulse…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
