[package]
name = "pulse-core"
version = "2.1.0"
edition = "2021"
description = "Shared Pulse engine: scripts, variables, collection runs"

[[bin]]
name = "pulse-contract"
path = "src/bin/pulse-contract.rs"

[dependencies]
base64 = "0.22"
boa_engine = { version = "0.20", default-features = false }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
