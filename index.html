<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse API Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/preload.css" />
    <script>
      (function () {
        try {
          var theme =
            localStorage.getItem("pulse-api-client/theme") ||
            localStorage.getItem("relay-api-client/theme") ||
            "system";
          var darkThemes = [
            "dark",
            "midnight",
            "graphite",
            "amethyst",
            "obsidian",
            "ember",
            "slate",
            "aurora",
            "polar",
            "dracula",
            "coffee",
            "neon",
          ];
          var resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme;
          var dark = darkThemes.indexOf(resolved) >= 0;
          document.documentElement.setAttribute("data-theme", resolved);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div class="pulse-boot pulse-boot--full" role="status" aria-live="polite" aria-label="Loading Pulse">
        <div class="pulse-boot__grain" aria-hidden="true"></div>
        <div class="pulse-boot__scan" aria-hidden="true"></div>
        <div class="pulse-boot__card">
          <div class="pulse-boot__meta">
            <p class="pulse-boot__kicker">Desk boot</p>
            <p class="pulse-boot__clock">2.0.0</p>
          </div>
          <p class="pulse-boot__title" aria-hidden="true">
            <span>P</span><span>U</span><span>L</span><span>S</span><span>E</span>
          </p>
          <p class="pulse-boot__line">
            <span class="pulse-boot__method">GET</span>
            <span class="pulse-boot__path">/workspace</span>
            <span class="pulse-boot__cursor" aria-hidden="true"></span>
          </p>
          <div class="pulse-boot__rail" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <ol class="pulse-boot__ticks" aria-hidden="true">
            <li>DNS</li>
            <li>TLS</li>
            <li>TTFB</li>
            <li>BODY</li>
          </ol>
          <p class="pulse-boot__label">Loading Pulse</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
