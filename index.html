<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse API Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme =
            localStorage.getItem("pulse-api-client/theme") ||
            localStorage.getItem("relay-api-client/theme") ||
            "system";
          var darkThemes = [
            "dark",
            "midnight",
            "graphite",
            "amethyst",
            "obsidian",
            "ember",
            "slate",
            "aurora",
            "polar",
            "dracula",
            "coffee",
            "neon",
          ];
          var resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme;
          var dark = darkThemes.indexOf(resolved) >= 0;
          document.documentElement.setAttribute("data-theme", resolved);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div
        style="
          display: flex;
          min-height: 100vh;
          align-items: center;
          justify-content: center;
          font-family: 'Plus Jakarta Sans', ui-sans-serif, sans-serif;
          font-size: 13px;
          color: oklch(0.55 0.01 264);
        "
      >
        Loading Pulse…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
